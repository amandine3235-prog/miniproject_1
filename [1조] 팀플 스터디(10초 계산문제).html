<!DOCTYPE html>
<html lang="ko">

<head>
    <script>

    </script>
    <style>
        /* 취소선 스타일 정의 */
        .strike {
            text-decoration: line-through;
        }

        /* 오답일 때 빨간색 정답 표시 스타일 */
        .correct-answer {
            color: red;
            font-weight: bold;
            margin-left: 5px;
        }

        /* 문제 레이아웃 간격 정돈 */
        .quiz-row {
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

    <h1>문제는 자동으로 생성되며, 10초가 지나면 자동 채점</h1>
    <h2>남은시간 <span id="timer">10</span></h2>
    <hr>

    <!-- 문제 영역 -->
    <div id="quiz-container"></div>

    <!-- 다시 버튼 및 정답 개수 표시 -->
    <div style="margin-top: 15px;">
        <button onclick="location.reload()">다시</button>
        <span id="score-text"></span>
    </div>

    

    <script>
        // 1. 필요한 변수 준비
        let timeLeft = 10; // 세부변수 설명 : 10...9...8... 0이 될 때까지 줄어들 초기값 10설정
        const operators = ['+', '-', '*', '/']; //사칙연산을 담은 배열
        const problems = []; // 문제 정보를 담을 배열 // <span>태그 안에 들어가는 정보들 ex) 45 * 55 = 100

        const timerEl = document.getElementById('timer'); // html태그 안에서 id가 timer인 <span id="timer">10</span>

        const containerEl = document.getElementById('quiz-container'); // html태그에서 문제 영역과 입력할 수 있는 인풋 태그가 나타날 영역
        //<div id="quiz-container"></div>

        const scoreTextEl = document.getElementById('score-text');// html태그에서 점수가 나타날 영역 선택자 <span id="score-text"></span>


        // 2. 랜덤 숫자 및 연산자 생성 함수
        // function getRandomNumber(min, max) {
        //     return Math.floor(Math.random() * (max - min + 1)) + min;
        // }

        // 3. 4개 문제 자동 생성 및 화면에 출력
        for (let i = 0; i < 4; i++) { //문제에서 산수문제 출력은 4개라서 i < 4
            let num1 = Math.floor(Math.random() * 100) + 1; // 1~100까지 랜덤숫자 뽑아주는 사칙연산 앞에 들어오는 숫자
            let num2 = Math.floor(Math.random() * 100) + 1; // 1~100까지 랜덤숫자 뽑아주는 사칙연산 뒤에 들어오는 숫자
            let op = operators[Math.floor(Math.random() * operators.length)]; // 사칙연산배열의 길이 만큼 랜덤으로 나오게 하겠음

            // 실제 정답 계산
            let realAnswer; // 실제 랜덤한 수끼리 사칙연산한 진짜 답을 담을 변수 (빈 값)
            if (op === '+') realAnswer = num1 + num2; // 사칙연산 중에 + 이면 더하기를 하고 나온 답을 realAnswer라는 변수에 담음
            else if (op === '-') realAnswer = num1 - num2;// 사칙연산 중에 - 이면 빼기를 하고 나온 답을 realAnswer라는 변수에 담음
            else if (op === '*') realAnswer = num1 * num2;// 사칙연산 중에 *(곱하기) 이면 곱하기를 하고 나온 답을 realAnswer라는 변수에 담음
            else if (op === '/') realAnswer = (num1 / num2).toFixed(2); // 소수점 2자리 정리(toFixed())
            // 사칙연산 중에 /(나누기) 이면 나누기를를 하고 나온 답을 realAnswer라는 변수에 담음

            // 생성된 문제 객체를 배열에 저장
            problems.push({ //초기에 위에서 선언한 problems는 [] 빈 객체
                num1: num1,//num1 :  let num1(랜덤숫자1번)
                num2: num2,//num2 :  let num2(랜덤숫자2번)
                op: op, // op : let op 사칙연산 4개 중 한개가 담김
                answer: realAnswer // if을 통과한 realAnswer에 담긴 값
            }); //problems는 총 4의 길이를 가진 객체 why? 4개 문제
            /*실제데이터 
              [인덱스0{num1,num2,op,answer},
              인덱스1{num1,num2,op,answer},
              인덱스2{num1,num2,op,answer},
              인덱스3{num1,num2,op,answer}]*/
          
            // 화면에 문제 줄(HTML) 생성
            const row = document.createElement('div'); //row라는 변수 안에는 지금 만들어진 <div></div>가 담김
            row.className = 'quiz-row'; // row = <div class = 'quiz-row'>
            row.innerHTML = `<span id="q-text-${i}">${num1} ${op} ${num2}</span>
                            <input type="text" id="user-input-${i}">`;
            /*row,innerHTML이 현재 나타내고 있는 값
            <div class = 'quiz-row'> 
            <span id="q-text-${i}">${num1} ${op} ${num2}</span>
            <input type="text" id="user-input-${i}">
            </div>
             */
            containerEl.appendChild(row);
            /*containerEl.appendChild(row);가 나타내는 값
            <div id="quiz-container">
                <div class = 'quiz-row'> 
                  <span id="q-text-${i}">${num1} ${op} ${num2}</span>
                  <input type="text" id="user-input-${i}">
                </div>
            </div>가 총4개 why? 문제가 4개라서 for문에 i < 4;로 나타내고 있기 때문에 */

        }

        // 4. 1초마다 남은 시간 줄어드는 타이머 함수
        const timerId = setInterval(() => {
            timeLeft--; // 초기값 timeLeft는 10에서 계속 10까지뺌 언제까지 if문으로 슝
            timerEl.innerText = timeLeft;

            // 0초가 되면 타이머 멈추고 채점 시작
            if (timeLeft === 0) { // timeLeft를 1초마다 1씩 빼고 있는데 0이되면?
                clearInterval(timerId); // setInterval() 중지
                checkAnswers(); //그리고 checkAnswer() 함수 실행
            }
        }, 1000); // 1초마다 계속



        // 5. 자동 채점 함수
        function checkAnswers() { 
            let correctCount = 0; // 정답을 카운트 할 변수이기 때문에 1증 증가를 해야되므로 초기값 0 설정

            for (let i = 0; i < problems.length; i++) { // 문제가 4개이기 때문에 Problems의 길이는 4 
                const inputEl = document.getElementById(`user-input-${i}`); 
                //row에 HTML로 넣었던 <input type="text" id="user-input-${i}">을 가르킴
                const qTextEl = document.getElementById(`q-text-${i}`);
                //row에 HTML로 넣었던 <span id="q-text-${i}">${num1} ${op} ${num2}</span>을 가르킴
                

                // 사용자가 입력한 값 가져오기 (숫자로 변환)
                const userInput = Number(inputEl.value.trim());
                //<input type="text" id="user-input-${i}">입력값(.value)을(를) 숫자형태로 받아올거고 trim()을 이용해서 앞뒤공백 다 자를게 
                const realAnswer = problems[i].answer; 
                // realAnswer는 Problems[i](for문을 돌았기 때문에 i로 배열 순회)에 .answer를 담을게

                // 정답 비교
                if (inputEl.value !== '' && userInput === realAnswer) {
                  //<input type="text" id="user-input-${i}">의 value가 공백이 아니면서 input의 입력값이 realAnswer와 같으면  )
                    correctCount++; // 정답 개수 증가  correctCount+1 1씩 증가
                } else {
                    // 오답이거나 작성하지 않은 경우
                    qTextEl.className ='strike'; // 취소선 추가 <span id="q-text-${i} class='strike">
                    inputEl.value = realAnswer; //정답 출력 (input의 값이 진짜 답으로 바뀜)
                    inputEl.className = 'correct-answer';  // 빨간색 정답 표시(<input type="text" id="user-input-${i} class="correct-answer">)
                }

                // 채점 완료 후 입력창 수정 불가 처리
                inputEl.disabled = true; //input을 회색처리 입력을 못하게 막음
            }

            // 맨 밑에 정답 개수 출력
            scoreTextEl.innerText = `정답: ${correctCount}개`; 
        }

    </script>

</body>

</html>
